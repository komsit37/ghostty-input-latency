# Matched config for the latency test. Keep font + geometry identical to alacritty.toml.
font-family = "Menlo"
font-size = 14
window-padding-x = 0
window-padding-y = 0
# vsync on = ghostty's default and what you actually use daily. The control run
# proved vsync off/on barely moves the number (~58 vs ~62ms), so measure the
# representative case.
window-vsync = true
# non-native fullscreen: same compositor path as alacritty's maximized window
macos-non-native-fullscreen = true
